# Render Blueprint: Static Site (ফ্রি, সবসময় চালু)। Render > New > Blueprint দিয়েও চালানো যায়,
# অথবা New > Static Site বানিয়ে Publish directory = site দিন (তখন নিচের headers Dashboard > Headers এ হাতে বসাতে হবে)।
services:
  - type: web
    name: viralvideo18
    runtime: static
    staticPublishPath: ./site
    headers:
      - {path: /*, name: X-Content-Type-Options, value: nosniff}
      - {path: /*, name: X-Frame-Options, value: SAMEORIGIN}
      - {path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin}
      - {path: /*, name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"}
      - {path: /*, name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains"}
      - {path: /*, name: Cross-Origin-Opener-Policy, value: same-origin}
      - {path: /sw.js, name: Cache-Control, value: no-cache}
      - {path: /lifeapp.html, name: X-Frame-Options, value: DENY}
      - {path: /lifeapp.html, name: X-Robots-Tag, value: "noindex, nofollow, noarchive"}
      - {path: /lifeapp.html, name: Cache-Control, value: no-store}
      - {path: /lifeapp.html, name: Content-Security-Policy, value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.cloudinary.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"}
