<style>
:root{--bg:#0a0a14;--c:#18182b;--h:#12122a;--bd:#2a2a4a;--g:#00e5ff;--p:#b44cff;--t:#eee}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;font-size:14px;padding-bottom:70px}
.tk{background:#000;overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--g)}
.tk span{display:inline-block;padding:6px 0;padding-left:100%;animation:m 18s linear infinite;color:var(--g)}
@keyframes m{to{transform:translateX(-100%)}}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--h);border-bottom:1px solid var(--bd)}
header b{font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:0 12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st div{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px 6px;text-align:center;color:#99a;font-size:12px}
.st b{display:block;font-size:20px;color:var(--g)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#0e0e20;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:1 0 auto;min-width:56px;background:var(--c);color:#aaa;border:1px solid var(--bd);border-radius:10px;padding:7px 8px;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:19px;line-height:1}
nav button.on{background:linear-gradient(135deg,var(--p),var(--g));color:#fff;border:0}
#q{display:block;width:100%;margin:12px 0 4px;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font:inherit}
.adbox{margin:10px 0;text-align:center;overflow:hidden}
.adbox:empty{display:none}
#bn{margin:10px 0;overflow:hidden;border-radius:12px;border:1px solid var(--bd)}
#bn:empty{display:none}
#bn div{display:flex;transition:transform .6s}
#bn a{flex:none;width:100%}
#bn img{width:100%;display:block}
.sec{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
.sec h2{font-size:15px;margin-bottom:10px}
#gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-height:200px}
.cd{background:#0e0e20;border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cd:hover,.cd:focus{border-color:var(--p);outline:0}
.cd img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#000}
.cd .i{padding:7px;display:flex;flex-direction:column;flex:1}
.cd h3{font-size:13px;line-height:1.4;height:36px;overflow:hidden}
.cd small{color:#889;display:block;margin:4px 0;font-size:11px}
.b{background:linear-gradient(135deg,var(--p),var(--g));border:0;color:#fff;border-radius:8px;padding:9px 6px;margin-top:auto;font:inherit;font-size:13px;cursor:pointer;width:100%}
#pg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 0}
#pg button{background:var(--c);color:var(--t);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:inherit}
#pg .on{background:var(--p);border:0}
.ft{position:fixed;bottom:0;left:0;right:0;background:#000d;padding:10px;text-align:center;backdrop-filter:blur(8px);z-index:6}
.ft a{color:#fff;background:#229ed9;padding:9px 18px;border-radius:24px;text-decoration:none;margin:0 3px;display:inline-block}
.ft a.fb{background:#1877f2}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov.on{display:flex}
.mb{background:var(--c);border:1px solid var(--p);border-radius:16px;padding:20px;max-width:360px;width:100%;position:relative}
.mb input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:var(--bg);color:var(--t)}
.mb .b{width:auto;padding:9px 14px;font-size:13px;margin:4px 3px 0 0}
.x{position:absolute;right:10px;top:6px;background:0;border:0;color:#fff;font-size:22px}
.mb a{color:var(--g)}
@media(max-width:420px){#gr{gap:8px}}
.fl{max-width:980px;margin:18px auto 0;padding:16px 12px;border-top:1px solid var(--bd);text-align:center;color:#889;font-size:12px}.fl a{color:#aab;text-decoration:none;display:inline-block;margin:4px 8px;font-size:13px}.fl a:hover{color:var(--g)}.fl p{margin-top:8px;line-height:1.6}
#fl{display:flex;gap:8px;margin:10px 0 2px;overflow-x:auto}#fl button{flex:none;background:var(--c);color:#aaa;border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}#fl button.on{background:linear-gradient(135deg,var(--p),var(--g));color:#fff;border:0}

<script>
const sb=supabase.createClient(CFG.U,CFG.K),$=i=>document.getElementById(i),cl=i=>$(i).classList.remove('on'),R=b=>Promise.resolve(b);
let S={},page=1,cat='home',q='',prof=null,LR=0,srt='new';
const PER=10,COLS='id,title,thumb,type,category,views,created_at,pinned';
const NV=[['home','হোম','🏠'],['video','ভিডিও','🎬'],['photo','ফটো','🖼️'],['story','গল্প','📖'],['viral','ভাইরাল','🔥'],['premium','প্রিমিয়াম','👑'],['fav','সেভড','❤️']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ago(d){const s=(Date.now()-new Date(d))/1000,u=[[31536e3,'year'],[2592e3,'month'],[86400,'day'],[3600,'hour'],[60,'minute']];for(const[n,l]of u)if(s>=n){const v=Math.floor(s/n);return v+' '+l+(v>1?'s':'')+' ago'}return 'just now'}
const tgl=()=>{const a=S.success_tg||S.admin_tg||'sgboss27';return /^http/.test(a)?a:'https://t.me/'+a.replace('@','')};
let Q=Promise.resolve();
function inj(el,html){Q=Q.then(async()=>{const d=document.createElement('div');d.innerHTML=html;const sc=[...d.querySelectorAll('script')];el.appendChild(d);for(const o of sc){const n=document.createElement('script');[...o.attributes].forEach(a=>n.setAttribute(a.name,a.value));n.text=o.text;await new Promise(r=>{if(n.src){n.onload=r;n.onerror=()=>{window.__adFail=(window.__adFail||0)+1;r()};setTimeout(r,4000)}o.replaceWith(n);if(!n.src)r()})}}).catch(()=>{})}
function showForm(){$('lt').textContent='প্রিমিয়াম কনটেন্টের জন্য অ্যাকাউন্ট করুন এবং সাবস্ক্রিপশনের জন্য অ্যাডমিনের সাথে যোগাযোগ করুন।';$('fm').style.display='block';$('lock').classList.add('on')}
function showSub(){const lb=(S.success_tg||S.admin_tg)?'অ্যাডমিনকে Telegram এ মেসেজ দিন':'@sgboss27 এটাতে মেসেজ দিন';$('lt').innerHTML=`✅ আপনার অ্যাকাউন্ট রয়েছে! প্রিমিয়াম দেখতে সাবস্ক্রিপশন কিনার জন্য অ্যাডমিনের সাথে যোগাযোগ করুন:<br><br><a target="_blank" rel="noopener" href="${esc(tgl())}">👉 ${lb}</a>`;$('fm').style.display='none';$('lock').classList.add('on')}
async function init(){
capInit('cf');
try{ONE=JSON.parse(localStorage.getItem('vvS')).d.grid_cols==='1'}catch(e){}
$('gr').classList.toggle('one',ONE);
const old=new URLSearchParams(location.search).get('v');
if(old&&/^\d+$/.test(old)){location.replace('post.html?v='+old);return}
// সব রিকুয়েস্ট একসাথে শুরু হয় (আগে একটার পর একটা চলত)
const pS=cachedGet('vvS',180000,async()=>(await sb.from('settings').select('*').eq('id',1).single()).data,d=>d&&d.maintenance===true).then(d=>({data:d}));
const pA=cachedGet('vvA',300000,async()=>(await sb.from('ads').select('id,kind,image_url,link').eq('active',true).or(`expires_at.is.null,expires_at.gt.${new Date().toISOString()}`)).data).then(d=>({data:d}));
const pM=me();
let tm;$('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value.trim().slice(0,60);page=1;nav();load();if(q.length>=2)RS.add(q)},600)};
$('q').onfocus=rsShow;$('q').addEventListener('blur',()=>setTimeout(()=>$('rs').innerHTML='',250));
nav();load();
const{data}=await pS;S=data||{};applyTheme(S);ONE=S.grid_cols==='1';$('gr').classList.toggle('one',ONE);
await pM;
if(maintGate(S,prof))return;
$('tk').textContent=S.ticker||'';
if(S.tg_channel)$('tgb').href=safeUrl(S.tg_channel);else $('tgb').style.display='none';
if(S.fb){$('fbb').href=safeUrl(S.fb);$('fbb').style.display='flex'}
const AON=S.ads_on!=='off';
if(AON){['adsterra_script','ad_popunder','ad_socialbar'].forEach(k=>{if(S[k])inj(document.body,S[k])});
if(S.ad_banner)inj($('adb'),S.ad_banner);
if(S.ad_native)inj($('adn'),S.ad_native)}
if(AON)ads(pA);
}
async function me(){const{data:{session}}=await sb.auth.getSession();prof=null;if(session)prof=(await sb.from('profiles').select('id,status,is_admin').eq('id',session.user.id).single()).data;
$('au').textContent=session?'Logout ('+(prof?.status||'')+')':'Login / Register';
$('au').onclick=()=>session?sb.auth.signOut().then(()=>location.reload()):showForm()}
const FL=[['new','🆕 নিউ পোস্ট'],['views','👁 মোস্ট ভিউ'],['old','🕰️ ওল্ড পোস্ট']];
function fl(){$('fl').innerHTML=FL.map(([k,l])=>`<button class="${k==srt?'on':''}" onclick="srt='${k}';page=1;fl();load()">${l}</button>`).join('')}
function nav(){fl();$('nv').innerHTML=NV.map(([k,l,ic])=>`<button class="${k==cat?'on':''}" onclick="cat='${k}';q='';$('q').value='';page=1;nav();load()"><i>${ic}</i>${l}</button>`).join('');$('sh').textContent=q?'🔍 সার্চ রেজাল্ট: '+q:(()=>{const n=NV.find(n=>n[0]==cat)||[];return (n[2]||'')+' '+(n[1]||'')})()}
const go=id=>location.href='post.html?v='+encodeURIComponent(id);
let ONE=false;const PM={},HOT=500,SK='<div class="skc"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>'.repeat(6);
function setCat(k){cat=k;q='';$('q').value='';page=1;nav();load()}
function rsShow(){const a=RS.get();$('rs').innerHTML=!$('q').value&&a.length?a.map(w=>`<button onclick="$('q').value=this.textContent;$('q').dispatchEvent(new Event('input'));$('rs').innerHTML=''">${esc(w)}</button>`).join(''):''}
function fv(id,b){const on=FAV.tog(PM[id]);b.textContent=on?'❤️':'🤍';if(cat==='fav')load()}
function card(p){PM[p.id]=p;const nw=Date.now()-new Date(p.created_at)<172800000,ht=Number(p.views||0)>=HOT,id=Number(p.id);
return `<div class="cd" role="button" tabindex="0" onclick="go(${id})" onkeydown="if(event.key==='Enter'){go(${id})}">
${p.thumb?`<img src="${esc(imgOpt(p.thumb,ONE?720:480))}" loading="lazy" decoding="async" alt="${esc(p.title)}" onload="this.classList.add('ld')" onerror="this.classList.add('ld')">`:''}
<div class="bgs">${nw?'<span>🆕 নতুন</span>':''}${ht?'<span>🔥 ট্রেন্ডিং</span>':''}</div>
<button class="fv" aria-label="সেভ" onclick="event.stopPropagation();fv(${id},this)">${FAV.has(id)?'❤️':'🤍'}</button>
<div class="i"><h3>${p.pinned?'📌 ':''}${p.type==='premium'?'🔒 ':''}${esc(p.title)}</h3><small>${ago(p.created_at)} • 👁 ${Number(p.views||0)}</small><button class="b" onclick="event.stopPropagation();go(${id})">${p.category==='video'?'▶ Watch':'⬇ Download'}</button></div></div>`}
function paint(data,count,app){
const h=(data||[]).map(card).join('');
if(app)$('gr').insertAdjacentHTML('beforeend',h);
else $('gr').innerHTML=h||`<div style="grid-column:1/-1;text-align:center;color:#889;padding:24px 8px">😕 ${cat==='fav'&&!q?'এখনো কিছু সেভ করা হয়নি। কার্ডের ♡ চাপলে এখানে জমবে।':'কিছু পাওয়া যায়নি'}<div class="rc">${NV.filter(n=>n[0]!=='fav'&&n[0]!==cat).map(n=>`<button onclick="setCat('${n[0]}')">${n[2]} ${n[1]}</button>`).join('')}</div></div>`;
$('pg').innerHTML=count>page*PER?'<button class="b more" id="mb" onclick="this.disabled=true;page++;load()">⬇ আরও দেখুন</button>':'';
const mb=$('mb');if(mb&&window.IntersectionObserver){const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){o.disconnect();mb.click()}},{rootMargin:'300px'});o.observe(mb)}
}
async function load(){
const rid=++LR,key='pl:'+cat+':'+srt+':'+page;let shown=false;
if(q&&q.replace(/[\s,#]+/g,'').length<2){$('gr').innerHTML='<p style="grid-column:1/-1;text-align:center;color:#889">সার্চের জন্য কমপক্ষে ২ অক্ষর লিখুন</p>';$('pg').innerHTML='';return}
if(cat==='fav'&&!q){const f=FAV.get();paint(f,0);$('pg').innerHTML='';return}
// আগে দেখা লিস্ট থাকলে সাথে সাথে দেখাই, পেছনে নতুন ডেটা আনি
if(!q&&page===1){try{const c=sessionStorage.getItem(key);if(c){const j=JSON.parse(c);paint(j.d,j.c);shown=true;if(j.t&&Date.now()-j.t<60000)return}}catch(e){}}
if(!shown&&page===1)$('gr').innerHTML=SK;
let r=sb.from('posts').select(COLS,{count:'exact'});
if(!q&&cat==='home')r=r.order('pinned',{ascending:false}).order('pinned_at',{ascending:false,nullsFirst:false});
r=srt==='views'?r.order('views',{ascending:false}).order('created_at',{ascending:false}):srt==='old'?r.order('created_at',{ascending:true}):r.order('created_at',{ascending:false});
r=r.range((page-1)*PER,page*PER-1);
if(!q)r=cat==='home'?r.neq('type','premium'):cat==='viral'?r.eq('type','viral'):cat==='premium'?r.eq('type','premium'):r.eq('category',cat).neq('type','premium');
else q.split(/[\s,#]+/).map(w=>w.replace(/[%*(),.:"'\\_]/g,'')).filter(Boolean).slice(0,5).forEach(w=>{r=r.or(`title.ilike.%${w}%,tags.ilike.%${w}%`)});
const{data,count,error}=await r;
if(rid!==LR)return; // দ্রুত ক্যাটাগরি বদলালে পুরনো উত্তর বাদ
if(error){if(!shown&&page===1)paint([],0);return}
if(!q&&page===1){try{sessionStorage.setItem(key,JSON.stringify({d:data||[],c:count||0,t:Date.now()}))}catch(e){}}
paint(data,count,page>1);
if(data?.length)sb.rpc('imp',{ids:data.map(p=>p.id)}).then(()=>{},()=>{});
}
async function reg(){const{error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value,options:{data:{tg:$('tg').value.replace('@','').trim().toLowerCase()},captchaToken:capToken()}});capReset();if(error)return alert(error.message);await me();showSub()}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value,options:{captchaToken:capToken()}});capReset();if(error)return alert(error.message);cl('lock');me()}
const adc=id=>{sb.rpc('ad_click',{aid:Number(id)}).then(()=>{},()=>{})};
async function ads(p){
const{data}=await p;
const bn=(data||[]).filter(a=>a.kind==='banner'),pp=(data||[]).filter(a=>a.kind==='popup');
if(bn.length){$('bn').innerHTML='<div>'+bn.map(a=>`<a href="${esc(safeUrl(a.link))}" target="_blank" rel="noopener" onclick="adc(${Number(a.id)})"><img src="${esc(imgOpt(a.image_url,900))}" decoding="async"></a>`).join('')+'</div>';let i=0;setInterval(()=>{if($('bn').firstChild){i=(i+1)%bn.length;$('bn').firstChild.style.transform=`translateX(-${i*100}%)`}},4000)}
const last=+localStorage.getItem('pp')||0;
if(pp.length&&Date.now()-last>20*60*1000){const a=pp[0];$('pi').src=imgOpt(a.image_url,700);$('pa').href=safeUrl(a.link);$('pa').onclick=()=>adc(a.id);setTimeout(()=>{$('pop').classList.add('on');localStorage.setItem('pp',Date.now())},3000)}
}
init();
</script>
<script src="ab.js" defer></script>
