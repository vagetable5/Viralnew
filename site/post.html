<style>
:root{--bg:#0a0a14;--c:#18182b;--h:#12122a;--bd:#2a2a4a;--g:#00e5ff;--p:#b44cff;--t:#eee}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;font-size:14px;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--h);border-bottom:1px solid var(--bd)}
header a{color:var(--t);text-decoration:none;font-weight:bold;font-size:17px}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.panel{background:var(--c);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.hero{width:100%;max-height:480px;aspect-ratio:16/9;object-fit:contain;background:#05050a;display:block}
.body{padding:16px}
h1{font-size:21px;line-height:1.4;margin:6px 0 12px}
.bd{display:inline-block;padding:3px 10px;border-radius:10px;background:var(--bd);font-size:12px;margin:0 4px 6px 0;color:#bbc}
.desc{white-space:pre-wrap;line-height:1.8;color:#ddd;overflow-wrap:anywhere;margin:12px 0 16px}
.meta{color:#99a;font-size:13px}
.b{background:linear-gradient(135deg,var(--p),var(--g));border:0;color:#fff;border-radius:10px;padding:13px 20px;font:inherit;font-size:16px;cursor:pointer;width:100%}
.b.s{background:#29243a;border:1px solid #51436b}
.sh{margin-top:18px;padding-top:14px;border-top:1px solid var(--bd)}
.sh h4{margin-bottom:8px;font-size:14px}
.lk{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.lk span{flex:1;color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adbox{margin:12px 0;text-align:center;overflow:hidden}
.adbox:empty{display:none}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov.on{display:flex}
.mb{background:var(--c);border:1px solid var(--p);border-radius:16px;padding:20px;max-width:360px;width:100%;position:relative}
.mb input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:var(--bg);color:var(--t)}
.mb .b{width:auto;padding:9px 14px;font-size:13px;margin:4px 3px 0 0}
.x{position:absolute;right:10px;top:6px;background:0;border:0;color:#fff;font-size:22px}
.mb a{color:var(--g)}
@media(max-width:420px){h1{font-size:18px}.body{padding:12px}}
.fl{max-width:980px;margin:18px auto 0;padding:16px 12px;border-top:1px solid var(--bd);text-align:center;color:#889;font-size:12px}.fl a{color:#aab;text-decoration:none;display:inline-block;margin:4px 8px;font-size:13px}.fl a:hover{color:var(--g)}.fl p{margin-top:8px;line-height:1.6}
</style>

<body>
<header><a href="index.html">🔥 Viral Video</a><a href="index.html" style="font-size:14px;font-weight:normal">← হোম</a></header>
<div class="wrap">
<div class="adbox" id="adb"></div>
<div id="d"><div class="panel"><div class="sk" style="aspect-ratio:16/9;border-radius:0"></div><div class="body"><div class="sk" style="height:22px;margin:6px 0 14px"></div><div class="sk" style="height:14px;margin:8px 0"></div><div class="sk" style="height:14px;width:70%"></div></div></div></div>
<div class="adbox" id="adn"></div>
</div>
<footer class="fl"><div><a href="info.html?p=about">আমাদের সম্পর্কে</a><a href="info.html?p=contact">যোগাযোগ</a><a href="info.html?p=privacy">প্রাইভেসি পলিসি</a><a href="info.html?p=terms">শর্তাবলী</a><a href="info.html?p=disclaimer">দাবিত্যাগ</a><a href="info.html?p=dmca">DMCA</a><a href="info.html?p=cookie">কুকি পলিসি</a></div><p>© 2026 Viral Video. সর্বস্বত্ব সংরক্ষিত।<br>এই সাইট ১৮+ ব্যবহারকারীদের জন্য। ⚠️18+Restricted🚫</p></footer>
<div class="ov" id="lock"><div class="mb"><button class="x" onclick="cl('lock')">×</button><p id="lt"></p><br><div id="fm"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6)"><input id="tg" placeholder="Telegram username (@ ছাড়া)"><div id="cf" style="margin:6px 0"></div><button class="b" onclick="reg()">Register</button><button class="b" onclick="login()">Login</button></div></div></div>
<script>
const sb=supabase.createClient(CFG.U,CFG.K),$=i=>document.getElementById(i),cl=i=>$(i).classList.remove('on'),R=b=>Promise.resolve(b);
let S={},P=null,prof=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const tgl=()=>{const a=S.success_tg||S.admin_tg||'sgboss27';return /^http/.test(a)?a:'https://t.me/'+a.replace('@','')};
let Q=Promise.resolve();
function inj(el,html){Q=Q.then(async()=>{const d=document.createElement('div');d.innerHTML=html;const sc=[...d.querySelectorAll('script')];el.appendChild(d);for(const o of sc){const n=document.createElement('script');[...o.attributes].forEach(a=>n.setAttribute(a.name,a.value));n.text=o.text;await new Promise(r=>{if(n.src){n.onload=r;n.onerror=()=>{window.__adFail=(window.__adFail||0)+1;r()};setTimeout(r,4000)}o.replaceWith(n);if(!n.src)r()})}}).catch(()=>{})}
function showForm(){$('lt').textContent='প্রিমিয়াম কনটেন্টের জন্য অ্যাকাউন্ট করুন এবং সাবস্ক্রিপশনের জন্য অ্যাডমিনের সাথে যোগাযোগ করুন।';$('fm').style.display='block';$('lock').classList.add('on')}
function showSub(){const lb=(S.success_tg||S.admin_tg)?'অ্যাডমিনকে Telegram এ মেসেজ দিন':'@sgboss27 এটাতে মেসেজ দিন';$('lt').innerHTML=`✅ আপনার অ্যাকাউন্ট রয়েছে! প্রিমিয়াম দেখতে সাবস্ক্রিপশন কিনার জন্য অ্যাডমিনের সাথে যোগাযোগ করুন:<br><br><a target="_blank" rel="noopener" href="${esc(tgl())}">👉 ${lb}</a>`;$('fm').style.display='none';$('lock').classList.add('on')}
// ছোট শেয়ার লিংক: ওয়েবসাইট/post.html?v=ID
function shareUrl(id){return location.origin+location.pathname.replace(/[^\/]*$/,'')+'post.html?v='+encodeURIComponent(id)}
function splitDesc(t){const m=t.length/2;let best=-1,bd=1e9;for(const re of [/\n/g,/[।.?!]\s/g]){let x;while((x=re.exec(t))){const i=x.index+x[0].length,dd=Math.abs(i-m);if(dd<bd){bd=dd;best=i}}if(best>0)break}return best>0&&best<t.length-1?[t.slice(0,best).replace(/\s+$/,''),t.slice(best).replace(/^\s+/,'')]:[t,'']}
function descBlock(t){t=(t||'').trim();if(!t)return '<div class="desc">এই কনটেন্টের কোনো বিবরণ দেওয়া হয়নি।</div>';const[a,b]=splitDesc(t);return `<div class="desc">${esc(a)}</div><div class="adbox" id="adm"></div>`+(b?`<div class="desc">${esc(b)}</div>`:'')}
async function init(){
capInit('cf');
const id=new URLSearchParams(location.search).get('v'),valid=id&&/^\d+$/.test(id);
// সেটিংস, লগইন প্রোফাইল আর পোস্ট — তিনটাই একসাথে আনা হয়
const pS=cachedGet('vvS',180000,async()=>(await sb.from('settings').select('*').eq('id',1).single()).data,d=>d&&d.maintenance===true).then(d=>({data:d}));
const pU=sb.auth.getSession().then(async({data:{session}})=>session?(await sb.from('profiles').select('id,status,is_admin').eq('id',session.user.id).single()).data:null);
const pP=valid?R(sb.from('posts').select('id,title,descr,tags,category,type,thumb,views,clicks,created_at').eq('id',id).maybeSingle()):null;
const{data}=await pS;S=data||{};applyTheme(S);
prof=await pU;
if(maintGate(S,prof))return;
const AON=S.ads_on!=='off';
if(AON){['adsterra_script','ad_popunder','ad_socialbar'].forEach(k=>{if(S[k])inj(document.body,S[k])});
if(S.ad_banner)inj($('adb'),S.ad_banner);
if(S.ad_native)inj($('adn'),S.ad_native)}
if(!valid)return nf();
const{data:p,error}=await pP;
if(error||!p)return nf();
P=p;document.title=(p.title||'Viral Video')+' | Viral Video';
// ভিউ গণনা (একই ট্যাবে একই পোস্ট বারবার রিলোড দিলে একবারই গোনা হবে)
let counted=false;try{counted=!!sessionStorage.getItem('v'+p.id)}catch(e){}
if(!counted){try{sessionStorage.setItem('v'+p.id,'1')}catch(e){}p.views=Number(p.views||0)+1;sb.rpc('hit',{pid:p.id,k:'view'}).then(()=>{},()=>{})}
const u=shareUrl(p.id),vid=p.category==='video';
$('d').innerHTML=`<div class="panel">
${p.thumb?`<img class="hero" src="${esc(imgOpt(p.thumb,1000))}" decoding="async" alt="${esc(p.title)}">`:''}
<div class="body">
<h1>${p.type==='premium'?'🔒 ':''}${esc(p.title)}</h1>
<div><span class="bd">🏷️ ${esc(p.category||'')}</span><span class="bd">${esc(p.type||'')}</span><span class="bd">📅 ${esc(new Date(p.created_at).toLocaleDateString('bn-BD'))}</span><span class="bd">👁 ${Number(p.views||0)}</span><span class="bd">⬇ ${Number(p.clicks||0)}</span></div>
${descBlock(p.descr)}
${p.tags?`<div class="meta" style="margin-bottom:16px">ট্যাগ: ${esc(p.tags)}</div>`:''}
<button class="b" onclick="dl()">${vid?'▶ Watch':'⬇️ Download'}</button>
<button class="b s" id="fvb" onclick="pfv()" style="margin-top:10px">${FAV.has(p.id)?'❤️ সেভ করা আছে':'🤍 পরে দেখব (সেভ করুন)'}</button>
<div class="sh"><h4>🔗 শেয়ার করুন</h4>
<div class="lk"><span>${esc(u.replace(/^https?:\/\//,''))}</span></div>
<div class="shr"><a class="b s" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(p.title+' '+u)}">💬 WhatsApp</a><a class="b s" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(p.title)}">✈️ Telegram</a><a class="b s" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(u)}">📘 Facebook</a><button class="b s" onclick="share()">🔗 Share</button></div></div>
</div></div><div class="panel body" id="rel" hidden style="margin-top:12px"></div>`;
loadRel(p);
if(S.ads_on!=='off'&&S.ad_post_mid&&$('adm'))inj($('adm'),S.ad_post_mid);
}
function pfv(){const on=FAV.tog(P);$('fvb').textContent=on?'❤️ সেভ করা আছে':'🤍 পরে দেখব (সেভ করুন)'}
async function loadRel(p){if(!p.category)return;try{const k='rel:'+p.category;let d=null;try{d=JSON.parse(sessionStorage.getItem(k)||'null')}catch(e){}
if(!d){d=(await sb.from('posts').select('id,title,thumb').eq('category',p.category).neq('type','premium').order('views',{ascending:false}).limit(8)).data||[];try{sessionStorage.setItem(k,JSON.stringify(d))}catch(e){}}
d=d.filter(x=>x.id!=p.id).slice(0,6);if(!d.length)return;
$('rel').innerHTML='<h4 style="margin-bottom:10px">🎬 আরও দেখুন</h4><div class="rel">'+d.map(x=>`<a href="post.html?v=${Number(x.id)}">${x.thumb?`<img src="${esc(imgOpt(x.thumb,400))}" loading="lazy" decoding="async" alt="">`:''}<span>${esc(x.title)}</span></a>`).join('')+'</div>';$('rel').hidden=false}catch(e){}}
function nf(){$('d').innerHTML='<div class="panel body"><p>দুঃখিত, এই কনটেন্টটি পাওয়া যায়নি।</p><br><a href="index.html"><button class="b s">← হোমে ফিরুন</button></a></div>'}
async function share(){
const u=shareUrl(P.id);
try{if(navigator.share)await navigator.share({title:P.title,url:u});else{await navigator.clipboard.writeText(u);alert('শেয়ার লিংক কপি হয়েছে।')}}
catch(e){if(e.name!=='AbortError')prompt('এই লিংকটি কপি করুন:',u)}
}
async function dl(){
const al=S.ads_on==='off'?'#':safeUrl(S.adsterra_link);if(al!=='#')window.open(al,'_blank','noopener');
const[a,b]=await Promise.all([sb.rpc('get_link',{pid:P.id}),sb.rpc('make_dl_token',{pid:P.id})]);
const{data,error}=a;
if(error){if(/maintenance/.test(error.message))return alert('সাইটে রক্ষণাবেক্ষণের কাজ চলছে। কিছুক্ষণ পর চেষ্টা করুন।');if(/disabled/.test(error.message))return alert('আপনার অ্যাকাউন্ট বন্ধ করা হয়েছে।');return prof?showSub():showForm()}
if(data?.tg){if(b.error||!b.data)return alert('লিংক তৈরি করা যায়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।');location.href=`https://t.me/${(S.bot_username||'').replace('@','')}?start=t_${b.data}`}
else if(data?.direct)location.href=safeUrl(data.direct);
else alert('এই কনটেন্টের ডাউনলোড লিংক এখনো যুক্ত করা হয়নি।');
}
async function reg(){const{error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value,options:{data:{tg:$('tg').value.replace('@','').trim().toLowerCase()},captchaToken:capToken()}});capReset();if(error)return alert(error.message);const{data:{session}}=await sb.auth.getSession();if(session)prof=(await sb.from('profiles').select('id,status,is_admin').eq('id',session.user.id).single()).data;showSub()}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value,options:{captchaToken:capToken()}});capReset();if(error)return alert(error.message);const{data:{session}}=await sb.auth.getSession();if(session)prof=(await sb.from('profiles').select('id,status,is_admin').eq('id',session.user.id).single()).data;cl('lock')}
init();
</script>
<script src="ab.js" defer></script>
